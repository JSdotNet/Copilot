# GitHub Copilot App configuration for JSdotNet/Copilot
#
# Global repository instructions live in .github/copilot-instructions.md and apply to
# ALL Copilot surfaces (VS Code, GitHub.com, CLI, this App). This file adds behaviour
# that is specific to the GitHub Copilot App — session lifecycle scripts and automation.

instructions: |-
  ## GitHub Copilot App — Session Instructions

  Full repository guidance is in `.github/copilot-instructions.md`; apply it in full.
  The notes below are specific to this App and supplement that file.

  ### MCP Server — When and How to Use It

  The MCP server is installed globally as `jsdotnet-project-guidelines-mcpserver`.
  It exposes tools: `list_docs`, `search_docs`, `search_docs_by_tag`, `list_docs_by_type`, `get_doc`.

  **Use the MCP server when working on plugin assets in `plugins/`:**
  Before adding or changing any plugin, agent, instruction, or skill, query the server
  to verify relevant guidelines or ADRs. For example: `search_docs("plugin structure")` or
  `list_docs_by_type("structures")`.

  **Do NOT use the MCP server when working on `docs/`:**
  You are editing the source content directly — querying the server would only reflect
  the previously published version, not your in-progress changes.

  ### Pull Requests

  PRs are created only when the user explicitly requests it (via the "Create PR" button).
  When creating a PR, always use the **JSdotNet** GitHub organization account.

automation:
  auto_issue_session: true
  remote_control: false
