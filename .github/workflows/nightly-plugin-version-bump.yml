name: Nightly Plugin Version Bump

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-plugin-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump changed plugin versions
        id: bump-plugin-versions
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $defaultBranch = "${{ github.event.repository.default_branch }}"
          if ([string]::IsNullOrWhiteSpace($defaultBranch)) {
              $defaultBranch = "main"
          }

          git fetch origin $defaultBranch --quiet
          $base = git merge-base "origin/$defaultBranch" HEAD

          $changedFiles = @(git diff --name-only $base HEAD)
          if (-not $changedFiles -or $changedFiles.Count -eq 0) {
              Write-Host "No changed files detected."
              "updated=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          $plugins = @{}
          foreach ($file in $changedFiles) {
              if ($file -match '^plugins/([^/]+)/') {
                  $name = $Matches[1]
                  if ((Test-Path -LiteralPath "plugins/$name/.github/plugin/plugin.json") -or (Test-Path -LiteralPath "plugins/$name/.claude-plugin/plugin.json")) {
                      $plugins[$name] = $true
                  }
              }
          }

          if ($plugins.Count -eq 0) {
              Write-Host "No plugin manifests to update."
              "updated=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          # A version lives in four places - both manifests, the marketplace entry, and the
          # copilot-plugins.md row - and nothing generates one from another. bump-version.mjs
          # writes the same value into all four; check-assets.mjs then fails if any disagree.
          foreach ($name in ($plugins.Keys | Sort-Object)) {
              node tools/bump-version.mjs $name patch
              if ($LASTEXITCODE -ne 0) { throw "bump failed for $name" }
          }
          node tools/check-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw "check-assets failed after the bump" }
          "updated=true" >> $env:GITHUB_OUTPUT

      - name: Create pull request
        if: steps.bump-plugin-versions.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: nightly bump plugin versions"
          title: "chore: nightly bump plugin versions"
          body: |
            Automated nightly plugin version bump.

            This PR increments the patch version - in both manifests, the marketplace entry, and the `copilot-plugins.md` row - of every plugin whose `plugins/<name>/` tree changed.
          branch: chore/nightly-plugin-version-bump
          delete-branch: true
